<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Image Arena">
<title>Local Image Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.app{max-width:620px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px 32px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 16px}
small{color:#999;letter-spacing:.15em;font-weight:700}h1{margin:3px 0 0;font-size:30px}
.badge{font-size:12px;background:#202126;padding:7px 10px;border-radius:999px}
.card{background:#15171d;border:1px solid #292c35;border-radius:20px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:140px;background:#0b0c10;color:#fff;border:1px solid #343741;border-radius:15px;padding:15px;font:inherit;font-size:17px}
.row{display:flex;gap:9px;margin-top:9px}.row>*{flex:1}
input,button,a{border-radius:14px;border:1px solid #343741;background:#24262e;color:#fff;padding:12px 14px;font:inherit;font-weight:700;text-align:center;text-decoration:none}
.full{width:100%;margin-top:9px}.primary{background:linear-gradient(135deg,#7a5cff,#5368ff);border:0}
button:disabled{opacity:.45}progress{width:100%;height:7px;margin-top:13px;accent-color:#6b6fff}
#status{font-size:13px;color:#aeb1ba;line-height:1.45}
.output{min-height:360px;display:flex;flex-direction:column;justify-content:center}
.output img{width:100%;border-radius:15px}
#empty{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8d909a;font-size:38px}
#empty strong{font-size:18px;color:#ddd}#empty span{font-size:13px}
.ok{color:#70e39a}.bad{color:#ff7f86}
</style>
</head>
<body>
<main class="app">
<header>
<div><small>LOCAL · PRIVATE</small><h1>Image Arena</h1></div>
<span id="gpu" class="badge">Prüfe …</span>
</header>

<section class="card">
<textarea id="prompt" placeholder="Beschreibe dein Bild …">Forest at sunset, photorealistic</textarea>
<div class="row">
<input id="seed" type="number" value="42">
<button id="random">Zufalls-Seed</button>
</div>
<button id="load" class="full" disabled>Lokales Modell laden</button>
<button id="generate" class="full primary" disabled>Bild erstellen</button>
<progress id="progress" max="100" value="0"></progress>
<p id="status">Initialisiere …</p>
</section>

<section class="card output">
<div id="empty">✦<strong>Dein Bild erscheint hier</strong><span>512 × 512 · SD‑Turbo</span></div>
<img id="result" hidden>
<div id="actions" class="row" hidden>
<button id="share">Teilen / Sichern</button>
<a id="download" download="local-image.png">Datei</a>
</div>
</section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
